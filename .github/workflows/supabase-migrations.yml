# Applies supabase/migrations to the linked project on push to main.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from
#                          https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#
# Without them the job skips rather than failing, so the site keeps deploying.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$ACCESS_TOKEN" ] && [ -n "$DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Read project ref
        if: steps.creds.outputs.ready == 'true'
        id: project
        run: |
          REF=$(grep -E '^project_id' supabase/config.toml | cut -d'"' -f2)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Push migrations
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ steps.project.outputs.ref }}"
          supabase db push
